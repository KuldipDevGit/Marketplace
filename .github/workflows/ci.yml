name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, format & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 (LTS)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Marketplace.sln

      - name: Verify formatting
        run: dotnet format Marketplace.sln --verify-no-changes --no-restore

      - name: Build (Release, warnings as errors)
        run: dotnet build Marketplace.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Marketplace.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (clean)
        run: npm ci

      - name: Build (production, bundle budgets enforced)
        run: npm run build -- --configuration production

      - name: Test (headless)
        run: npm test -- --watch=false
