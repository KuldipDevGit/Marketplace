version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      aspire:
        patterns: [ "Aspire.*", "Microsoft.Extensions.ServiceDiscovery*" ]
      opentelemetry:
        patterns: [ "OpenTelemetry.*" ]
      masstransit:
        patterns: [ "MassTransit*" ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
